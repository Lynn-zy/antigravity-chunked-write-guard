name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

      - name: Verify version alignment and extract release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG_NAME || "";
            const match = /^v(\d+\.\d+\.\d+)$/.exec(tag);
            if (!match) {
              throw new Error(`Invalid release tag "${tag}", expected vX.Y.Z`);
            }
            const version = match[1];
            for (const file of ["plugin.json", "package.json"]) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              if (data.version !== version) {
                throw new Error(`${file} version (${data.version}) does not match tag ${tag}`);
              }
            }
            const changelog = fs.existsSync("CHANGELOG.md")
              ? fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n")
              : "";
            const lines = changelog.split("\n");
            const startIdx = lines.findIndex((line) => line.startsWith(`## [${version}]`));
            if (startIdx !== -1) {
              const nextIdx = lines.findIndex((line, i) => i > startIdx && line.startsWith("## ["));
              const notes = lines
                .slice(startIdx + 1, nextIdx === -1 ? lines.length : nextIdx)
                .join("\n")
                .trim();
              if (notes) {
                fs.writeFileSync("/tmp/release-notes.md", `${notes}\n`, "utf8");
              }
            }
          '

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi
