<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write Guard</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --wg-bg: var(--background, #101010);
      --wg-fg: var(--foreground, #f5f5f5);
      --wg-muted: var(--muted-foreground, #9ca3af);
      --wg-card: var(--card, rgba(255, 255, 255, 0.035));
      --wg-subtle: rgba(255, 255, 255, 0.03);
      --wg-border: var(--border, rgba(255, 255, 255, 0.1));
      --wg-accent: var(--primary, #ffc799);
      --wg-ok: #34d399;
      --wg-err: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--wg-bg);
      color: var(--wg-fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 定制 Chromium/Electron 细滚动条，避免 Windows 原生亮白粗滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--wg-fg) 18%, transparent);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--wg-fg) 32%, transparent);
    }

    ::-webkit-scrollbar-corner,
    ::-webkit-scrollbar-button {
      display: none;
    }

    /* 独立外层容器：避免 preload.js 内联设置的 body.style.padding = 0 清除边距 */
    .page {
      padding: 16px 16px 18px;
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      background: color-mix(in srgb, var(--wg-accent) 16%, transparent);
      color: var(--wg-accent);
      border: 1px solid color-mix(in srgb, var(--wg-accent) 38%, transparent);
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--wg-muted);
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preset-card {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--wg-border);
      background: var(--wg-card);
      color: inherit;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 120ms ease;
    }

    .preset-card:hover {
      border-color: color-mix(in srgb, var(--wg-accent) 48%, var(--wg-border));
      background: color-mix(in srgb, var(--wg-accent) 4%, var(--wg-card));
    }

    .preset-card:hover .action-pill {
      color: var(--wg-accent);
      border-color: color-mix(in srgb, var(--wg-accent) 40%, transparent);
    }

    .preset-card:active:not([aria-pressed="true"]) {
      transform: scale(0.994);
    }

    .preset-card[aria-pressed="true"] {
      cursor: default;
      border-color: color-mix(in srgb, var(--wg-accent) 75%, var(--wg-border));
      background: color-mix(in srgb, var(--wg-accent) 8%, var(--wg-card));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wg-accent) 18%, transparent);
    }

    .preset-card:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 600;
    }

    .action-pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      color: var(--wg-muted);
      border: 1px solid var(--wg-border);
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .preset-card[aria-pressed="true"] .action-pill {
      font-weight: 600;
      color: var(--wg-accent);
      border-color: color-mix(in srgb, var(--wg-accent) 45%, transparent);
      background: color-mix(in srgb, var(--wg-accent) 14%, transparent);
    }

    .card-desc {
      margin: 0 0 10px;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--wg-muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .metric-cell {
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--wg-subtle);
      border: 1px solid color-mix(in srgb, var(--wg-border) 65%, transparent);
    }

    .metric-label {
      color: var(--wg-muted);
      display: block;
      font-size: 10.5px;
      margin-bottom: 1px;
    }

    .metric-val {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .status-bar {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--wg-border);
      background: var(--wg-card);
      font-size: 11.5px;
      color: var(--wg-muted);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid color-mix(in srgb, var(--wg-border) 75%, transparent);
    }

    .stats-counters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-item {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      color: var(--wg-muted);
    }

    .stat-num {
      font-size: 13px;
      font-weight: 600;
      color: var(--wg-fg);
      font-variant-numeric: tabular-nums;
    }

    .stat-num.nonzero {
      color: var(--wg-accent);
    }

    .reset-btn {
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--wg-border);
      background: transparent;
      color: var(--wg-muted);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease;
    }

    .reset-btn:hover:not(:disabled) {
      color: var(--wg-fg);
      border-color: color-mix(in srgb, var(--wg-fg) 35%, transparent);
    }

    .reset-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--wg-accent);
    }

    .status-dot.ok { background: var(--wg-ok); }
    .status-dot.err { background: var(--wg-err); }

    .status-msg {
      color: var(--wg-muted);
      font-size: 11.5px;
    }

    .status-msg.ok { color: var(--wg-ok); }
    .status-msg.err { color: var(--wg-err); }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <span class="title">Chunked Write Guard</span>
      <span id="activeBadge" class="badge">加载中…</span>
    </div>
    <p class="subtitle">点击下方档位切换单次写入限制。Hook 立即生效，规则文件同步更新。</p>

    <div id="presetList" class="preset-list" role="group" aria-label="写入阈值档位"></div>

    <div class="status-bar">
      <div class="stats-row">
        <div class="stats-counters">
          <span class="stat-item">超限拦截 <strong id="denyCount" class="stat-num">0</strong></span>
          <span class="stat-item">断流恢复 <strong id="recoveryCount" class="stat-num">0</strong></span>
        </div>
        <button id="resetStatsBtn" type="button" class="reset-btn" disabled>清零</button>
      </div>
      <div class="status-row">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusMsg" class="status-msg">正在读取当前配置…</span>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const listEl = document.getElementById('presetList');
      const badgeEl = document.getElementById('activeBadge');
      const denyCountEl = document.getElementById('denyCount');
      const recoveryCountEl = document.getElementById('recoveryCount');
      const resetStatsBtn = document.getElementById('resetStatsBtn');
      const statusDotEl = document.getElementById('statusDot');
      const statusMsgEl = document.getElementById('statusMsg');
      let busy = false;
      let loading = false;
      let activePresetId = '';
      let lastStats = { denyCount: 0, recoveryCount: 0, lastTriggeredAt: null };
      let statusKind = '';

      const apiFetch = (url, options = {}) => {
        if (window.sidecar && typeof window.sidecar.fetch === 'function') {
          return window.sidecar.fetch(url, options);
        }
        return fetch(url, options);
      };

      const setStatus = (text, kind = '') => {
        statusKind = kind;
        statusMsgEl.textContent = text;
        statusMsgEl.className = kind ? `status-msg ${kind}` : 'status-msg';
        statusDotEl.className = kind ? `status-dot ${kind}` : 'status-dot';
      };

      const formatTriggerTime = (iso) => {
        if (!iso) return '暂无触发记录';
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? `最近触发：${iso}` : `最近触发：${date.toLocaleString()}`;
      };

      const renderStats = (stats) => {
        const deny = Number(stats?.denyCount ?? 0);
        const recovery = Number(stats?.recoveryCount ?? 0);
        lastStats = {
          denyCount: deny,
          recoveryCount: recovery,
          lastTriggeredAt: stats?.lastTriggeredAt ?? null,
        };
        denyCountEl.textContent = String(deny);
        recoveryCountEl.textContent = String(recovery);
        denyCountEl.className = deny > 0 ? 'stat-num nonzero' : 'stat-num';
        recoveryCountEl.className = recovery > 0 ? 'stat-num nonzero' : 'stat-num';
        resetStatsBtn.disabled = busy || (deny === 0 && recovery === 0);
      };

      const render = (state) => {
        activePresetId = state.presetId;
        badgeEl.textContent = `当前：${state.presetId} 行档`;
        renderStats(state.stats);

        listEl.innerHTML = '';
        for (const preset of state.presets) {
          const isActive = preset.id === state.presetId;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'preset-card';
          btn.disabled = busy;
          btn.setAttribute('aria-pressed', String(isActive));
          btn.innerHTML = `
            <div class="card-top">
              <span class="card-title">${preset.label}</span>
              <span class="action-pill">${isActive ? '● 生效中' : '切换'}</span>
            </div>
            <p class="card-desc">${preset.summary}</p>
            <div class="metrics">
              <div class="metric-cell">
                <span class="metric-label">单次写入目标</span>
                <span class="metric-val">≤ ${preset.softTargetLines} 行</span>
              </div>
              <div class="metric-cell">
                <span class="metric-label">单次写入上限</span>
                <span class="metric-val">${preset.maxWriteLines} 行 / ${preset.maxWriteKb} KB</span>
              </div>
              <div class="metric-cell">
                <span class="metric-label">edit_file 合计上限</span>
                <span class="metric-val">${preset.maxEditCombinedLines} 行 / ${preset.maxEditCombinedKb} KB</span>
              </div>
              <div class="metric-cell">
                <span class="metric-label">断流恢复上限</span>
                <span class="metric-val">≤ ${preset.recoveryTargetLines} 行</span>
              </div>
            </div>
          `;
          btn.addEventListener('click', () => switchPreset(preset.id));
          listEl.appendChild(btn);
        }
      };

      const loadState = async (silent = false) => {
        if (loading) return;
        loading = true;
        try {
          const res = await apiFetch('/api/state', { method: 'GET' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const state = await res.json();
          render(state);
          if (!silent || statusKind === '') {
            setStatus(formatTriggerTime(state.stats?.lastTriggeredAt), '');
          }
        } catch (err) {
          if (!silent) {
            setStatus(`读取状态失败：${err.message}`, 'err');
          }
        } finally {
          loading = false;
        }
      };

      const switchPreset = async (presetId) => {
        if (busy || presetId === activePresetId) return;
        busy = true;
        setStatus(`正在切换至 ${presetId} 行档…`, '');
        for (const btn of listEl.querySelectorAll('button')) btn.disabled = true;
        resetStatsBtn.disabled = true;

        let nextState = null;
        let errorMessage = '';
        try {
          const res = await apiFetch('/api/preset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ presetId }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          nextState = data;
        } catch (err) {
          errorMessage = err.message;
        } finally {
          busy = false;
        }

        if (nextState) {
          render(nextState);
          setStatus(`已切换为 ${nextState.active.label}（Hook 已生效，AGENTS.md 已同步）`, 'ok');
          return;
        }

        for (const btn of listEl.querySelectorAll('button')) btn.disabled = false;
        renderStats(lastStats);
        setStatus(`切换失败：${errorMessage}`, 'err');
      };

      const resetStats = async () => {
        if (busy || resetStatsBtn.disabled) return;
        busy = true;
        resetStatsBtn.disabled = true;

        let nextState = null;
        let errorMessage = '';
        try {
          const res = await apiFetch('/api/stats/reset', { method: 'POST' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          nextState = data;
        } catch (err) {
          errorMessage = err.message;
        } finally {
          busy = false;
        }

        if (nextState) {
          render(nextState);
          setStatus('触发统计已清零', 'ok');
          return;
        }

        setStatus(`清零失败：${errorMessage}`, 'err');
        loadState(true);
      };

      resetStatsBtn.addEventListener('click', resetStats);

      // 切回面板时自动拉取最新统计，避免后台定时轮询
      window.addEventListener('focus', () => {
        if (!busy) loadState(true);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !busy) loadState(true);
      });

      loadState();
    })();
  </script>
</body>
</html>
