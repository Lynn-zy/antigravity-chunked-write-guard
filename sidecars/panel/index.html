<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write Guard</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --wg-bg: var(--background, #101010);
      --wg-fg: var(--foreground, #f5f5f5);
      --wg-muted: var(--muted-foreground, #9ca3af);
      --wg-card: var(--card, rgba(255, 255, 255, 0.035));
      --wg-subtle: rgba(255, 255, 255, 0.03);
      --wg-border: var(--border, rgba(255, 255, 255, 0.1));
      --wg-accent: var(--primary, #ffc799);
      --wg-ok: #34d399;
      --wg-err: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--wg-bg);
      color: var(--wg-fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 定制 Chromium/Electron 细滚动条，避免 Windows 原生亮白粗滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--wg-fg) 18%, transparent);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--wg-fg) 32%, transparent);
    }

    ::-webkit-scrollbar-corner,
    ::-webkit-scrollbar-button {
      display: none;
    }

    /* 独立外层容器：避免 preload.js 内联设置的 body.style.padding = 0 清除边距 */
    .page {
      padding: 16px 16px 18px;
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    .title-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .version-tag {
      padding: 2px 7px;
      border-radius: 999px;
      font: inherit;
      font-size: 10.5px;
      line-height: 1.35;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--wg-muted);
      border: 1px solid var(--wg-border);
      background: var(--wg-subtle);
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .version-tag:hover {
      color: var(--wg-fg);
      border-color: color-mix(in srgb, var(--wg-accent) 45%, var(--wg-border));
      background: color-mix(in srgb, var(--wg-accent) 8%, transparent);
    }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      background: color-mix(in srgb, var(--wg-accent) 16%, transparent);
      color: var(--wg-accent);
      border: 1px solid color-mix(in srgb, var(--wg-accent) 38%, transparent);
    }

    .ghost-btn {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--wg-border);
      background: transparent;
      color: var(--wg-muted);
      font: inherit;
      font-size: 10.5px;
      line-height: 1.35;
      white-space: nowrap;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .ghost-btn:hover:not(:disabled) {
      color: var(--wg-fg);
      border-color: color-mix(in srgb, var(--wg-accent) 45%, var(--wg-border));
      background: color-mix(in srgb, var(--wg-accent) 8%, transparent);
    }

    .ghost-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--wg-muted);
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preset-card {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--wg-border);
      background: var(--wg-card);
      color: inherit;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 120ms ease;
    }

    .preset-card:hover {
      border-color: color-mix(in srgb, var(--wg-accent) 48%, var(--wg-border));
      background: color-mix(in srgb, var(--wg-accent) 4%, var(--wg-card));
    }

    .preset-card:hover .action-pill {
      color: var(--wg-accent);
      border-color: color-mix(in srgb, var(--wg-accent) 40%, transparent);
    }

    .preset-card:active:not([aria-pressed="true"]) {
      transform: scale(0.994);
    }

    .preset-card[aria-pressed="true"] {
      cursor: default;
      border-color: color-mix(in srgb, var(--wg-accent) 75%, var(--wg-border));
      background: color-mix(in srgb, var(--wg-accent) 8%, var(--wg-card));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wg-accent) 18%, transparent);
    }

    .preset-card:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 600;
    }

    .action-pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      color: var(--wg-muted);
      border: 1px solid var(--wg-border);
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .preset-card[aria-pressed="true"] .action-pill {
      font-weight: 600;
      color: var(--wg-accent);
      border-color: color-mix(in srgb, var(--wg-accent) 45%, transparent);
      background: color-mix(in srgb, var(--wg-accent) 14%, transparent);
    }

    .card-desc {
      margin: 0 0 10px;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--wg-muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .metric-cell {
      padding: 6px 9px;
      border-radius: 8px;
      background: var(--wg-subtle);
      border: 1px solid color-mix(in srgb, var(--wg-border) 65%, transparent);
    }

    .metric-label {
      color: var(--wg-muted);
      display: block;
      font-size: 10.5px;
      margin-bottom: 1px;
    }

    .metric-val {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .metric-cell.full {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .metric-cell.full .metric-label {
      margin-bottom: 0;
    }

    .toggle-card {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--wg-border);
      background: var(--wg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-info {
      min-width: 0;
    }

    .toggle-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--wg-fg);
      margin-bottom: 2px;
    }

    .toggle-desc {
      margin: 0;
      font-size: 11px;
      line-height: 1.4;
      color: var(--wg-muted);
    }

    .switch-btn {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      padding: 0;
      border: 1px solid var(--wg-border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--wg-fg) 10%, transparent);
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .switch-btn::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--wg-muted);
      transition: transform 150ms ease, background 150ms ease;
    }

    .switch-btn[aria-checked="true"] {
      background: color-mix(in srgb, var(--wg-accent) 28%, transparent);
      border-color: color-mix(in srgb, var(--wg-accent) 65%, transparent);
    }

    .switch-btn[aria-checked="true"]::after {
      transform: translateX(16px);
      background: var(--wg-accent);
    }

    .switch-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .status-bar {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--wg-border);
      background: var(--wg-card);
      font-size: 11.5px;
      color: var(--wg-muted);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid color-mix(in srgb, var(--wg-border) 75%, transparent);
    }

    .stats-counters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-item {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      color: var(--wg-muted);
    }

    .stat-num {
      font-size: 13px;
      font-weight: 600;
      color: var(--wg-fg);
      font-variant-numeric: tabular-nums;
    }

    .stat-num.nonzero {
      color: var(--wg-accent);
    }

    .reset-btn {
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--wg-border);
      background: transparent;
      color: var(--wg-muted);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease;
    }

    .reset-btn:hover:not(:disabled) {
      color: var(--wg-fg);
      border-color: color-mix(in srgb, var(--wg-fg) 35%, transparent);
    }

    .reset-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--wg-accent);
    }

    .status-dot.ok { background: var(--wg-ok); }
    .status-dot.err { background: var(--wg-err); }

    .status-msg {
      color: var(--wg-muted);
      font-size: 11.5px;
    }

    .status-msg.ok { color: var(--wg-ok); }
    .status-msg.err { color: var(--wg-err); }

    .update-dialog {
      width: min(390px, calc(100vw - 28px));
      padding: 0;
      border-radius: 14px;
      border: 1px solid var(--wg-border);
      background: var(--wg-bg);
      color: var(--wg-fg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .update-dialog::backdrop {
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(4px);
    }

    .update-dialog.compact-notice {
      width: min(300px, calc(100vw - 28px));
    }

    .update-dialog.compact-notice .dialog-head,
    .update-dialog.compact-notice .dialog-foot {
      display: none;
    }

    .update-dialog.compact-notice .dialog-body {
      padding: 24px 20px;
      align-items: center;
      text-align: center;
    }

    .update-dialog.compact-notice .update-hero {
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .update-dialog.compact-notice .update-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
    }

    .update-dialog.compact-notice .update-icon.spin::after {
      width: 18px;
      height: 18px;
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--wg-border);
    }

    .dialog-title {
      font-size: 13.5px;
      font-weight: 600;
    }

    .dialog-close {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--wg-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .dialog-close:hover:not(:disabled) {
      color: var(--wg-fg);
      background: var(--wg-subtle);
    }

    .dialog-close:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .dialog-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .update-hero {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .update-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      background: color-mix(in srgb, var(--wg-accent) 16%, transparent);
      color: var(--wg-accent);
      border: 1px solid color-mix(in srgb, var(--wg-accent) 35%, transparent);
    }

    .update-icon.ok {
      background: color-mix(in srgb, var(--wg-ok) 15%, transparent);
      color: var(--wg-ok);
      border-color: color-mix(in srgb, var(--wg-ok) 38%, transparent);
    }

    .update-icon.err {
      background: color-mix(in srgb, var(--wg-err) 15%, transparent);
      color: var(--wg-err);
      border-color: color-mix(in srgb, var(--wg-err) 38%, transparent);
    }

    .update-icon.spin::after {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--wg-accent) 28%, transparent);
      border-top-color: var(--wg-accent);
      animation: wg-spin 700ms linear infinite;
    }

    @keyframes wg-spin {
      to { transform: rotate(360deg); }
    }

    .update-summary {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
    }

    .update-detail {
      margin-top: 2px;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--wg-muted);
      word-break: break-word;
    }

    .update-detail.err {
      color: var(--wg-err);
    }

    .progress-wrap {
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .progress-wrap.show {
      display: flex;
    }

    .progress-track {
      position: relative;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: color-mix(in srgb, var(--wg-fg) 10%, transparent);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--wg-accent);
      transition: width 160ms ease;
    }

    .progress-fill.indeterminate {
      width: 38%;
      animation: wg-slide 1.1s ease-in-out infinite;
    }

    .progress-fill.err {
      width: 100%;
      background: var(--wg-err);
    }

    @keyframes wg-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    .progress-meta {
      font-size: 11px;
      color: var(--wg-muted);
      font-variant-numeric: tabular-nums;
    }

    .version-meta {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--wg-subtle);
      border: 1px solid var(--wg-border);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .version-meta.show {
      display: flex;
    }

    .release-link {
      color: var(--wg-accent);
      text-decoration: none;
      font-size: 11px;
      white-space: nowrap;
    }

    .release-link:hover {
      text-decoration: underline;
    }

    .md-notes {
      display: none;
      margin: 0;
      padding: 12px 14px;
      max-height: 220px;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid var(--wg-border);
      background: var(--wg-subtle);
      color: color-mix(in srgb, var(--wg-fg) 84%, transparent);
      font-size: 12.5px;
      line-height: 1.65;
      word-break: break-word;
    }

    .md-notes.show {
      display: block;
    }

    #changelogDialog {
      width: min(440px, calc(100vw - 24px));
    }

    #changelogDialog .dialog-title {
      font-size: 14.5px;
    }

    #changelogDialog .dialog-hint {
      font-size: 12px;
    }

    .md-notes.changelog-body {
      display: block;
      max-height: min(62vh, 420px);
      font-size: 13px;
      line-height: 1.7;
    }

    .md-notes > :first-child {
      margin-top: 0;
    }

    .md-notes > :last-child {
      margin-bottom: 0;
    }

    .md-h2 {
      margin: 14px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid color-mix(in srgb, var(--wg-border) 75%, transparent);
      font-size: 14px;
      font-weight: 600;
      color: var(--wg-accent);
    }

    .md-h3 {
      margin: 10px 0 5px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--wg-fg);
    }

    .md-p {
      margin: 5px 0;
    }

    .md-list {
      margin: 5px 0;
      padding-left: 18px;
    }

    .md-list li {
      margin: 4px 0;
    }

    .md-code {
      padding: 1px 5px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--wg-fg) 10%, transparent);
      color: var(--wg-fg);
      font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .md-strong {
      color: var(--wg-fg);
      font-weight: 600;
    }

    .md-link {
      color: var(--wg-accent);
      text-decoration: none;
    }

    .md-link:hover {
      text-decoration: underline;
    }

    .dialog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--wg-border);
    }

    .dialog-hint {
      font-size: 10.5px;
      color: var(--wg-muted);
    }

    .dialog-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .dialog-btn {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--wg-border);
      background: transparent;
      color: var(--wg-muted);
      font: inherit;
      font-size: 11.5px;
      line-height: 1.4;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .dialog-btn:hover:not(:disabled) {
      color: var(--wg-fg);
      border-color: color-mix(in srgb, var(--wg-fg) 30%, var(--wg-border));
      background: var(--wg-subtle);
    }

    .dialog-btn.primary {
      border-color: color-mix(in srgb, var(--wg-accent) 60%, transparent);
      background: color-mix(in srgb, var(--wg-accent) 22%, transparent);
      color: var(--wg-accent);
      font-weight: 600;
    }

    .dialog-btn.primary:hover:not(:disabled) {
      background: color-mix(in srgb, var(--wg-accent) 32%, transparent);
    }

    .dialog-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <div class="title-group">
        <span class="title">Chunked Write Guard</span>
        <button id="versionTag" type="button" class="version-tag" title="查看变更日志">v—</button>
        <button id="checkUpdateBtn" type="button" class="ghost-btn">检查更新</button>
      </div>
      <span id="activeBadge" class="badge">加载中…</span>
    </div>
    <p class="subtitle">点击下方档位切换单次写入目标与超限警戒线。Hook 不阻断落盘，规则文件同步更新。</p>

    <div id="presetList" class="preset-list" role="group" aria-label="写入阈值档位"></div>

    <div class="toggle-card">
      <div class="toggle-info">
        <div class="toggle-title">超限事后提醒</div>
        <p id="reminderDesc" class="toggle-desc">超限写入落盘后，下一轮提醒模型按当前档位分段写入</p>
      </div>
      <button id="reminderToggle" type="button" role="switch" aria-checked="true" aria-label="超限事后提醒开关" class="switch-btn"></button>
    </div>

    <div class="status-bar">
      <div class="stats-row">
        <div class="stats-counters">
          <span class="stat-item">超限落盘 <strong id="oversizeCount" class="stat-num">0</strong></span>
          <span class="stat-item">事后提醒 <strong id="reminderCount" class="stat-num">0</strong></span>
        </div>
        <button id="resetStatsBtn" type="button" class="reset-btn" disabled>清零</button>
      </div>
      <div class="status-row">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusMsg" class="status-msg">正在读取当前配置…</span>
      </div>
    </div>
  </main>

  <dialog id="updateDialog" class="update-dialog" aria-labelledby="updateDialogTitle">
    <div class="dialog-head">
      <span id="updateDialogTitle" class="dialog-title">插件更新</span>
      <button id="updateCloseIcon" type="button" class="dialog-close" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="update-hero">
        <span id="updateIcon" class="update-icon"></span>
        <div>
          <div id="updateSummary" class="update-summary">准备检查更新…</div>
          <div id="updateDetail" class="update-detail"></div>
        </div>
      </div>
      <div id="updateProgressWrap" class="progress-wrap">
        <div class="progress-track">
          <div id="updateProgressFill" class="progress-fill"></div>
        </div>
        <div id="updateProgressMeta" class="progress-meta"></div>
      </div>
      <div id="updateVersionMeta" class="version-meta">
        <span id="updateVersionPair"></span>
        <a id="updateReleaseLink" class="release-link" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
      <div id="updateNotes" class="md-notes"></div>
    </div>
    <div class="dialog-foot">
      <span id="updateHint" class="dialog-hint">保留本地档位与统计日志</span>
      <div class="dialog-actions">
        <button id="updateCancelBtn" type="button" class="dialog-btn">关闭</button>
        <button id="updateActionBtn" type="button" class="dialog-btn primary" hidden></button>
      </div>
    </div>
  </dialog>

  <dialog id="changelogDialog" class="update-dialog" aria-labelledby="changelogDialogTitle">
    <div class="dialog-head">
      <span id="changelogDialogTitle" class="dialog-title">变更日志</span>
      <button id="changelogCloseIcon" type="button" class="dialog-close" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div id="changelogContent" class="md-notes changelog-body"></div>
    </div>
    <div class="dialog-foot">
      <span id="changelogVersionHint" class="dialog-hint"></span>
      <div class="dialog-actions">
        <button id="changelogCloseBtn" type="button" class="dialog-btn">关闭</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      const listEl = document.getElementById('presetList');
      const versionTagEl = document.getElementById('versionTag');
      const badgeEl = document.getElementById('activeBadge');
      const checkUpdateBtn = document.getElementById('checkUpdateBtn');
      const reminderToggle = document.getElementById('reminderToggle');
      const reminderDescEl = document.getElementById('reminderDesc');
      const oversizeCountEl = document.getElementById('oversizeCount');
      const reminderCountEl = document.getElementById('reminderCount');
      const resetStatsBtn = document.getElementById('resetStatsBtn');
      const statusDotEl = document.getElementById('statusDot');
      const statusMsgEl = document.getElementById('statusMsg');

      let busy = false;
      let loading = false;
      let activePresetId = '';
      let reminderEnabled = true;
      let lastStats = { oversizeCount: 0, reminderCount: 0, lastTriggeredAt: null };
      let statusKind = '';

      const apiFetch = (url, options = {}) => {
        if (window.sidecar && typeof window.sidecar.fetch === 'function') {
          return window.sidecar.fetch(url, options);
        }
        return fetch(url, options);
      };

      const postJson = async (url, payload) => {
        const res = await apiFetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      };

      const syncInteractiveState = () => {
        for (const btn of listEl.querySelectorAll('button')) {
          btn.disabled = busy;
        }
        reminderToggle.disabled = busy;
        resetStatsBtn.disabled =
          busy || (lastStats.oversizeCount === 0 && lastStats.reminderCount === 0);
      };

      const setStatus = (text, kind = '') => {
        statusKind = kind;
        statusMsgEl.textContent = text;
        statusMsgEl.className = kind ? `status-msg ${kind}` : 'status-msg';
        statusDotEl.className = kind ? `status-dot ${kind}` : 'status-dot';
      };

      const formatTriggerTime = (iso) => {
        if (!iso) return '暂无触发记录';
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? `最近触发：${iso}` : `最近触发：${date.toLocaleString()}`;
      };

      const renderStats = (stats) => {
        const oversize = Number(stats?.oversizeCount ?? 0);
        const reminder = Number(stats?.reminderCount ?? 0);
        lastStats = {
          oversizeCount: oversize,
          reminderCount: reminder,
          lastTriggeredAt: stats?.lastTriggeredAt ?? null,
        };
        oversizeCountEl.textContent = String(oversize);
        reminderCountEl.textContent = String(reminder);
        oversizeCountEl.className = oversize > 0 ? 'stat-num nonzero' : 'stat-num';
        reminderCountEl.className = reminder > 0 ? 'stat-num nonzero' : 'stat-num';
      };

      const renderReminderToggle = (enabled) => {
        reminderEnabled = Boolean(enabled);
        reminderToggle.setAttribute('aria-checked', String(reminderEnabled));
        reminderDescEl.textContent = reminderEnabled
          ? '超限写入落盘后，下一轮提醒模型按当前档位分段写入'
          : '已关闭，仅记录超限统计，不向模型上下文注入提醒';
      };

      const render = (state) => {
        activePresetId = state.presetId;
        if (typeof state.version === 'string' && state.version) {
          versionTagEl.textContent = `v${state.version}`;
        }
        badgeEl.textContent = `当前：${state.presetId} 行档`;
        renderReminderToggle(state.reminderEnabled !== false);
        renderStats(state.stats);

        listEl.innerHTML = '';
        for (const preset of state.presets) {
          const isActive = preset.id === state.presetId;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'preset-card';
          btn.setAttribute('aria-pressed', String(isActive));
          btn.innerHTML = `
            <div class="card-top">
              <span class="card-title">${preset.label}</span>
              <span class="action-pill">${isActive ? '● 生效中' : '切换'}</span>
            </div>
            <p class="card-desc">${preset.summary}</p>
            <div class="metrics">
              <div class="metric-cell">
                <span class="metric-label">单次写入目标</span>
                <span class="metric-val">≤ ${preset.softTargetLines} 行</span>
              </div>
              <div class="metric-cell">
                <span class="metric-label">单次写入警戒线</span>
                <span class="metric-val">${preset.warnWriteLines} 行 / ${preset.warnWriteKb} KB</span>
              </div>
              <div class="metric-cell full">
                <span class="metric-label">edit_file 合计警戒线</span>
                <span class="metric-val">${preset.warnEditCombinedLines} 行 / ${preset.warnEditCombinedKb} KB</span>
              </div>
            </div>
          `;
          btn.addEventListener('click', () => switchPreset(preset.id));
          listEl.appendChild(btn);
        }
        syncInteractiveState();
      };

      const runMutation = async (pendingText, action, onSuccess, failPrefix) => {
        if (busy) return;
        busy = true;
        if (pendingText) setStatus(pendingText, '');
        syncInteractiveState();

        let nextState = null;
        let errorMessage = '';
        try {
          nextState = await action();
        } catch (err) {
          errorMessage = err.message;
        } finally {
          busy = false;
        }

        if (nextState) {
          render(nextState);
          onSuccess(nextState);
          return;
        }

        syncInteractiveState();
        setStatus(`${failPrefix}：${errorMessage}`, 'err');
      };

      const switchPreset = (presetId) => {
        if (presetId === activePresetId) return;
        return runMutation(
          `正在切换至 ${presetId} 行档…`,
          () => postJson('/api/preset', { presetId }),
          (state) => setStatus(`已切换为 ${state.active.label}（Hook 已生效，AGENTS.md 已同步）`, 'ok'),
          '切换失败',
        );
      };

      const toggleReminder = () => {
        const nextEnabled = !reminderEnabled;
        return runMutation(
          nextEnabled ? '正在开启超限事后提醒…' : '正在关闭超限事后提醒…',
          () => postJson('/api/reminder', { enabled: nextEnabled }),
          (state) =>
            setStatus(
              state.reminderEnabled
                ? '已开启超限事后提醒（Hook 与 AGENTS.md 已同步）'
                : '已关闭超限事后提醒（超限落盘后仅统计，不注入上下文）',
              'ok',
            ),
          '设置失败',
        );
      };

      const resetStats = () => {
        if (resetStatsBtn.disabled) return;
        return runMutation(
          '',
          () => postJson('/api/stats/reset', {}),
          () => setStatus('触发统计已清零', 'ok'),
          '清零失败',
        );
      };

      const loadState = async (silent = false) => {
        if (loading) return;
        loading = true;
        try {
          const res = await apiFetch('/api/state', { method: 'GET' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const state = await res.json();
          render(state);
          if (!silent || statusKind === '') {
            setStatus(formatTriggerTime(state.stats?.lastTriggeredAt), '');
          }
        } catch (err) {
          if (!silent) {
            setStatus(`读取状态失败：${err.message}`, 'err');
          }
        } finally {
          loading = false;
        }
      };

      const INLINE_MD_RE = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https:\/\/[^)\s]+\))/g;

      const appendInlineMarkdown = (parent, text) => {
        let lastIndex = 0;
        for (const match of text.matchAll(INLINE_MD_RE)) {
          const idx = match.index ?? 0;
          if (idx > lastIndex) {
            parent.appendChild(document.createTextNode(text.slice(lastIndex, idx)));
          }
          const token = match[0];
          if (token.startsWith('`')) {
            const code = document.createElement('code');
            code.className = 'md-code';
            code.textContent = token.slice(1, -1);
            parent.appendChild(code);
          } else if (token.startsWith('**')) {
            const strong = document.createElement('strong');
            strong.className = 'md-strong';
            strong.textContent = token.slice(2, -2);
            parent.appendChild(strong);
          } else {
            const splitAt = token.indexOf('](');
            const link = document.createElement('a');
            link.className = 'md-link';
            link.textContent = token.slice(1, splitAt);
            link.href = token.slice(splitAt + 2, -1);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            parent.appendChild(link);
          }
          lastIndex = idx + token.length;
        }
        if (lastIndex < text.length) {
          parent.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
      };

      const renderMarkdown = (container, markdown) => {
        container.replaceChildren();
        const lines = String(markdown ?? '').replace(/\r\n/g, '\n').split('\n');
        let listEl = null;

        const closeList = () => {
          listEl = null;
        };

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) {
            closeList();
            continue;
          }
          if (/^#\s+changelog$/i.test(line)) {
            closeList();
            continue;
          }
          const headingMatch = /^(#{1,4})\s+(.*)$/.exec(line);
          if (headingMatch) {
            closeList();
            const level = headingMatch[1].length;
            const heading = document.createElement('div');
            heading.className = level <= 2 ? 'md-h2' : 'md-h3';
            appendInlineMarkdown(heading, headingMatch[2]);
            container.appendChild(heading);
            continue;
          }
          const listMatch = /^[-*]\s+(.*)$/.exec(line);
          if (listMatch) {
            if (!listEl) {
              listEl = document.createElement('ul');
              listEl.className = 'md-list';
              container.appendChild(listEl);
            }
            const li = document.createElement('li');
            appendInlineMarkdown(li, listMatch[1]);
            listEl.appendChild(li);
            continue;
          }
          closeList();
          const p = document.createElement('p');
          p.className = 'md-p';
          appendInlineMarkdown(p, line);
          container.appendChild(p);
        }
      };

      const updateDialog = document.getElementById('updateDialog');
      const updateCloseIcon = document.getElementById('updateCloseIcon');
      const updateCancelBtn = document.getElementById('updateCancelBtn');
      const updateActionBtn = document.getElementById('updateActionBtn');
      const updateIconEl = document.getElementById('updateIcon');
      const updateSummaryEl = document.getElementById('updateSummary');
      const updateDetailEl = document.getElementById('updateDetail');
      const updateProgressWrap = document.getElementById('updateProgressWrap');
      const updateProgressFill = document.getElementById('updateProgressFill');
      const updateProgressMeta = document.getElementById('updateProgressMeta');
      const updateVersionMeta = document.getElementById('updateVersionMeta');
      const updateVersionPair = document.getElementById('updateVersionPair');
      const updateReleaseLink = document.getElementById('updateReleaseLink');
      const updateNotesEl = document.getElementById('updateNotes');

      const changelogDialog = document.getElementById('changelogDialog');
      const changelogCloseIcon = document.getElementById('changelogCloseIcon');
      const changelogCloseBtn = document.getElementById('changelogCloseBtn');
      const changelogContentEl = document.getElementById('changelogContent');
      const changelogVersionHintEl = document.getElementById('changelogVersionHint');

      let updateState = { status: 'idle' };
      let updatePollTimer = null;
      let reloadPollTimer = null;
      let reloadCountdownTimer = null;
      let reloadCountdownLeft = 0;

      const isUpdateLocked = () =>
        updateState.status === 'installing' ||
        updateState.status === 'installed' ||
        updateState.status === 'reloading';

      const stopUpdatePoll = () => {
        if (updatePollTimer !== null) {
          clearInterval(updatePollTimer);
          updatePollTimer = null;
        }
      };

      const stopReloadCountdown = () => {
        if (reloadCountdownTimer !== null) {
          clearInterval(reloadCountdownTimer);
          reloadCountdownTimer = null;
        }
        reloadCountdownLeft = 0;
      };

      const formatMegabytes = (bytes) => `${(bytes / (1024 * 1024)).toFixed(2)} MB`;

      const triggerReload = () => {
        stopReloadCountdown();
        stopUpdatePoll();
        renderUpdateState({
          ...updateState,
          status: 'reloading',
          message: '正在重启面板服务并加载新版本…',
          error: null,
        });
        // 宿主可能已提前触发重启导致请求断连，由 startReloadWatch 统一探活刷新
        postJson('/api/update', { action: 'reload' }).catch(() => {});
      };

      const startReloadCountdown = (seconds = 3) => {
        if (reloadCountdownTimer !== null) return;
        reloadCountdownLeft = seconds;
        const syncCountdownText = () => {
          const ver = updateState.currentVersion ? ` v${updateState.currentVersion}` : '';
          updateSummaryEl.textContent = `更新成功${ver}`;
          updateDetailEl.textContent = `${reloadCountdownLeft} 秒后自动重新加载…`;
          updateDetailEl.className = 'update-detail';
        };
        syncCountdownText();
        reloadCountdownTimer = setInterval(() => {
          reloadCountdownLeft -= 1;
          if (reloadCountdownLeft <= 0) {
            triggerReload();
            return;
          }
          syncCountdownText();
        }, 1000);
      };

      const startReloadWatch = () => {
        if (reloadPollTimer !== null) return;
        let attempts = 0;
        const probe = async () => {
          attempts += 1;
          try {
            const res = await apiFetch('/api/state', { method: 'GET', cache: 'no-store' });
            if (res.ok) {
              clearInterval(reloadPollTimer);
              reloadPollTimer = null;
              window.location.reload();
              return;
            }
          } catch {
            // Sidecar 重启窗口期内连接拒绝属正常现象，继续探活
          }
          if (attempts >= 50) {
            clearInterval(reloadPollTimer);
            reloadPollTimer = null;
            renderUpdateState({
              ...updateState,
              status: 'error',
              message: '等待面板重启超时',
              error: '请重新打开 Write Guard 侧边栏面板以加载新版本。',
            });
          }
        };
        setTimeout(() => {
          reloadPollTimer = setInterval(probe, 500);
        }, 900);
      };

      const renderUpdateState = (state) => {
        updateState = state || { status: 'idle' };
        const st = updateState.status;
        const locked = isUpdateLocked();
        const isCompactSuccess = st === 'installed' || st === 'reloading';
        updateDialog.classList.toggle('compact-notice', isCompactSuccess);
        updateCloseIcon.disabled = locked;
        updateCancelBtn.disabled = locked;

        const iconMap = {
          checking: { cls: 'update-icon spin', text: '' },
          installing: { cls: 'update-icon spin', text: '' },
          reloading: { cls: 'update-icon spin', text: '' },
          current: { cls: 'update-icon ok', text: '✓' },
          installed: { cls: 'update-icon ok', text: '✓' },
          available: { cls: 'update-icon', text: '↑' },
          error: { cls: 'update-icon err', text: '!' },
        };
        const iconCfg = iconMap[st] || { cls: 'update-icon', text: '·' };
        updateIconEl.className = iconCfg.cls;
        updateIconEl.textContent = iconCfg.text;

        if (st !== 'installed' || reloadCountdownTimer === null) {
          updateSummaryEl.textContent = updateState.message || '准备检查更新…';
        }
        const detailText =
          st === 'error'
            ? updateState.error || '未知错误'
            : st === 'available' && updateState.source === 'tag'
              ? '当前仓库尚未发布 Release，已自动回退至最新稳定标签。'
              : '';
        if (st !== 'installed') {
          updateDetailEl.textContent = detailText;
          updateDetailEl.className = st === 'error' ? 'update-detail err' : 'update-detail';
        }

        const showProgress =
          st === 'checking' || st === 'installing' || st === 'error';
        updateProgressWrap.className = showProgress ? 'progress-wrap show' : 'progress-wrap';
        const dl = updateState.download;
        if (st === 'error') {
          updateProgressFill.className = 'progress-fill err';
          updateProgressFill.style.width = '100%';
          updateProgressMeta.textContent = '';
        } else if (st === 'installing' && updateState.phase === 'download' && dl?.totalBytes > 0) {
          const pct = Math.min(100, Math.max(0, Number(dl.percent ?? 0)));
          updateProgressFill.className = 'progress-fill';
          updateProgressFill.style.width = `${pct}%`;
          updateProgressMeta.textContent = `${formatMegabytes(dl.downloadedBytes)} / ${formatMegabytes(dl.totalBytes)} (${pct}%)`;
        } else if (showProgress) {
          updateProgressFill.className = 'progress-fill indeterminate';
          updateProgressFill.style.width = '';
          updateProgressMeta.textContent =
            st === 'installing' && dl?.downloadedBytes > 0
              ? `已下载 ${formatMegabytes(dl.downloadedBytes)}`
              : '';
        }

        const hasVersions =
          !isCompactSuccess && Boolean(updateState.currentVersion && updateState.latestVersion);
        updateVersionMeta.className = hasVersions ? 'version-meta show' : 'version-meta';
        if (hasVersions) {
          updateVersionPair.textContent = `当前 v${updateState.currentVersion} → 最新 v${updateState.latestVersion}`;
          const safeUrl =
            typeof updateState.releaseUrl === 'string' &&
            updateState.releaseUrl.startsWith('https://github.com/')
              ? updateState.releaseUrl
              : '';
          updateReleaseLink.hidden = !safeUrl;
          if (safeUrl) updateReleaseLink.href = safeUrl;
        }

        const notes = typeof updateState.releaseNotes === 'string' ? updateState.releaseNotes.trim() : '';
        const showNotes = Boolean(notes) && st === 'available';
        if (showNotes) {
          renderMarkdown(updateNotesEl, notes);
        } else {
          updateNotesEl.replaceChildren();
        }
        updateNotesEl.className = showNotes ? 'md-notes show' : 'md-notes';

        const actionLabelMap = {
          available: '立即更新',
          error: '重试',
        };
        const actionLabel = actionLabelMap[st] || '';
        updateActionBtn.hidden = !actionLabel;
        updateActionBtn.textContent = actionLabel;
        updateActionBtn.disabled = locked;

        if (st === 'checking' || st === 'installing') {
          if (updatePollTimer === null && updateDialog.open) {
            updatePollTimer = setInterval(() => {
              requestUpdate({ action: 'status' });
            }, 600);
          }
        } else {
          stopUpdatePoll();
        }

        if (st === 'installed') {
          startReloadCountdown(3);
        } else {
          stopReloadCountdown();
        }

        if (st === 'reloading') {
          startReloadWatch();
        }
      };

      const requestUpdate = async (payload) => {
        try {
          const state = await postJson('/api/update', payload);
          renderUpdateState(state);
        } catch (err) {
          // 文件替换阶段宿主可能已主动重启 Sidecar，切入探活刷新而不误报失败
          if (
            updateState.status === 'installing' &&
            (updateState.phase === 'install' || updateState.phase === 'complete')
          ) {
            triggerReload();
            return;
          }
          stopUpdatePoll();
          renderUpdateState({
            ...updateState,
            status: 'error',
            message: '更新请求失败',
            error: err.message,
          });
        }
      };

      const openUpdateDialog = () => {
        if (!updateDialog.open) {
          updateDialog.showModal();
        }
        renderUpdateState({
          ...updateState,
          status: 'checking',
          message: '正在检查更新状态…',
          error: null,
        });
        return requestUpdate({ action: 'check' });
      };

      const closeUpdateDialog = () => {
        if (!isUpdateLocked() && updateDialog.open) {
          updateDialog.close();
        }
      };

      const openChangelogDialog = async () => {
        if (!changelogDialog.open) {
          changelogDialog.showModal();
        }
        changelogVersionHintEl.textContent = '';
        changelogContentEl.replaceChildren();
        const loadingLine = document.createElement('p');
        loadingLine.className = 'md-p';
        loadingLine.textContent = '正在读取变更日志…';
        changelogContentEl.appendChild(loadingLine);

        try {
          const res = await apiFetch('/api/changelog', { method: 'GET' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          changelogVersionHintEl.textContent = data.version ? `当前版本 v${data.version}` : '';
          if (data.markdown) {
            renderMarkdown(changelogContentEl, data.markdown);
          } else {
            renderMarkdown(changelogContentEl, '暂无本地变更日志记录。');
          }
        } catch (err) {
          renderMarkdown(changelogContentEl, `读取变更日志失败：${err.message}`);
        }
      };

      const closeChangelogDialog = () => {
        if (changelogDialog.open) {
          changelogDialog.close();
        }
      };

      versionTagEl.addEventListener('click', openChangelogDialog);
      changelogCloseIcon.addEventListener('click', closeChangelogDialog);
      changelogCloseBtn.addEventListener('click', closeChangelogDialog);
      changelogDialog.addEventListener('click', (event) => {
        if (event.target === changelogDialog) closeChangelogDialog();
      });

      reminderToggle.addEventListener('click', toggleReminder);
      resetStatsBtn.addEventListener('click', resetStats);
      checkUpdateBtn.addEventListener('click', openUpdateDialog);
      updateCloseIcon.addEventListener('click', closeUpdateDialog);
      updateCancelBtn.addEventListener('click', closeUpdateDialog);
      updateDialog.addEventListener('close', () => {
        stopUpdatePoll();
        stopReloadCountdown();
      });
      updateDialog.addEventListener('cancel', (event) => {
        if (isUpdateLocked()) event.preventDefault();
      });
      updateDialog.addEventListener('click', (event) => {
        if (event.target === updateDialog) closeUpdateDialog();
      });
      updateActionBtn.addEventListener('click', () => {
        if (updateState.status === 'available') {
          requestUpdate({ action: 'apply', version: updateState.latestVersion });
        } else if (updateState.status === 'error') {
          requestUpdate({ action: 'check' });
        }
      });

      // 切回面板时自动拉取最新统计（短节流避免 focus 与 visibilitychange 连发两次请求）
      let lastAutoRefreshAt = 0;
      const refreshOnReturn = () => {
        const now = Date.now();
        if (busy || reloadPollTimer !== null || now - lastAutoRefreshAt < 500) return;
        lastAutoRefreshAt = now;
        loadState(true);
      };
      window.addEventListener('focus', refreshOnReturn);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshOnReturn();
      });

      loadState();
    })();
  </script>
</body>
</html>
