<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="436" viewBox="0 0 1200 436"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How Antigravity Rail Works</title>
  <desc id="arch-desc">Architecture diagram showing how Sidecar Panel UI updates config/settings.json and rules/AGENTS.md, feeding three independent non-blocking Hooks that log stats and fail open on errors.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Crisp Light Canvas -->
  <rect width="1200" height="436" rx="20" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="434" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="54" fill="#111827" font-size="25" font-weight="700"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Non-Blocking Guardrail Lifecycle</text>
  <rect x="822" y="28" width="330" height="34" rx="17" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="987" y="50" text-anchor="middle" fill="#4B5563" font-size="15.5" font-weight="600"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Single Source of Truth · Fail-Open</text>

  <!-- Column 1: Control & Single Source of Truth -->
  <g id="col-control" transform="translate(48 86)">
    <!-- Sidecar UI -->
    <rect x="0" y="0" width="280" height="134" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="4.5" fill="#10B981"/>
    <text x="38" y="34" fill="#111827" font-size="19.5" font-weight="700"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Sidecar Panel UI</text>
    <text x="20" y="68" fill="#374151" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• 3 module &amp; Hook toggles</text>
    <text x="20" y="96" fill="#374151" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• EN / 中文 live switch</text>
    <text x="20" y="122" fill="#6B7280" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• In-app GitHub updater</text>

    <!-- Down connector -->
    <line x1="140" y1="134" x2="140" y2="168" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Single Source of Truth -->
    <rect x="0" y="176" width="280" height="140" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="20" y="210" fill="#1D4ED8" font-size="18.5" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config/settings.json</text>
    <text x="20" y="242" fill="#1E3A8A" font-size="17.5" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Renders rules/AGENTS.md</text>
    <text x="20" y="270" fill="#4B5563" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Disabled modules stripped</text>
    <text x="20" y="296" fill="#4B5563" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Hooks read thresholds live</text>
  </g>

  <!-- Connectors Col 1 -> Col 2 -->
  <path d="M 328 332 L 356 332 L 356 136 L 380 136" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 356 244 L 380 244" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 356 332 L 356 352 L 380 352" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

  <!-- Column 2: Three Independent Hooks -->
  <g id="col-hooks" transform="translate(388 86)">
    <!-- Hook 1 -->
    <rect x="0" y="0" width="444" height="96" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="0" y="14" width="4" height="68" rx="2" fill="#2563EB"/>
    <text x="22" y="34" fill="#111827" font-size="19.5" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">write-guard</text>
    <text x="424" y="33" text-anchor="end" fill="#2563EB" font-size="15.5" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PostToolUse → PreInv</text>
    <text x="22" y="64" fill="#374151" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Checks lines/KB after write; queues 1</text>
    <text x="22" y="86" fill="#6B7280" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">next-turn hint in config/pending/ (30m TTL)</text>

    <!-- Hook 2 -->
    <rect x="0" y="110" width="444" height="96" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="0" y="124" width="4" height="68" rx="2" fill="#64748B"/>
    <text x="22" y="144" fill="#111827" font-size="19.5" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">responsive-mode</text>
    <text x="424" y="143" text-anchor="end" fill="#4B5563" font-size="15.5" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PreInvocation</text>
    <text x="22" y="174" fill="#374151" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Next-turn hint on silent opener/streak;</text>
    <text x="22" y="196" fill="#6B7280" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">same-turn reminder for unlinked file paths</text>

    <!-- Hook 3 -->
    <rect x="0" y="220" width="444" height="96" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="0" y="234" width="4" height="68" rx="2" fill="#10B981"/>
    <text x="22" y="254" fill="#111827" font-size="19.5" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tool-locale</text>
    <text x="424" y="253" text-anchor="end" fill="#059669" font-size="15.5" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PreInvocation</text>
    <text x="22" y="284" fill="#374151" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Auto-detects 9 non-Latin scripts;</text>
    <text x="22" y="306" fill="#6B7280" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1 same-turn hint if tool labels stay English</text>
  </g>

  <!-- Connectors Col 2 -> Col 3 -->
  <path d="M 832 136 L 856 136 L 856 352 L 832 352" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 832 244 L 856 244" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <path d="M 856 170 L 876 170" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 856 334 L 876 334" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

  <!-- Column 3: Safety & Telemetry -->
  <g id="col-safety" transform="translate(884 86)">
    <!-- Safety Box -->
    <rect x="0" y="0" width="268" height="168" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="20" y="34" fill="#065F46" font-size="19.5" font-weight="700"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Safety Guarantees</text>
    <text x="20" y="68" fill="#1F2937" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• Never blocks writes</text>
    <text x="20" y="98" fill="#1F2937" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• Bad input → {}</text>
    <text x="20" y="128" fill="#1F2937" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• Skips subagents</text>
    <text x="20" y="154" fill="#4B5563" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• Pure Node.js ESM</text>

    <!-- Telemetry Box -->
    <rect x="0" y="186" width="268" height="130" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="20" y="220" fill="#111827" font-size="18.5" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config/events.jsonl</text>
    <text x="20" y="252" fill="#374151" font-size="17.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">4 cumulative counters</text>
    <text x="20" y="280" fill="#6B7280" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">+ latest 3 trigger logs</text>
    <text x="20" y="304" fill="#6B7280" font-size="16.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">One-click reset in UI</text>
  </g>
</svg>
