<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title-zh hero-desc-zh">
  <title id="hero-title-zh">Antigravity Rail — 零依赖 Antigravity 三合一行为护栏插件</title>
  <desc id="hero-desc-zh">零依赖的 Antigravity 行为护栏插件，集成分段写入、先回话与途中汇报、工具摘要多语种匹配三大模块，并配备中英双语侧边栏面板实时调控。</desc>

  <!-- Crisp Light Canvas -->
  <rect width="1200" height="360" rx="20" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Left Identity & Value Block -->
  <g id="identity-block-zh" transform="translate(56 44)">
    <!-- Minimalist Logo Mark (geometry from assets/logo.svg) -->
    <g transform="scale(0.42)">
      <rect x="8" y="8" width="112" height="112" rx="24" fill="#111827"/>
      <rect x="26" y="30" width="76" height="15" rx="5" fill="#FFFFFF"/>
      <rect x="26" y="56" width="76" height="15" rx="5" fill="#CBD5E1"/>
      <rect x="26" y="82" width="48" height="15" rx="5" fill="#94A3B8"/>
      <path d="M85 80 L102 89.5 L85 99 Z" fill="#10B981"/>
    </g>

    <!-- Category Pill -->
    <rect x="68" y="10" width="286" height="32" rx="16" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="88" cy="26" r="4.5" fill="#10B981"/>
    <text x="102" y="31.5" fill="#4B5563" font-size="15.5" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ANTIGRAVITY PLUGIN · v3.0.0</text>

    <!-- Repository Name -->
    <text x="0" y="118" fill="#111827" font-size="54" font-weight="800" letter-spacing="-1.2"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Antigravity Rail</text>

    <!-- Plain-Language Value -->
    <text x="0" y="164" fill="#374151" font-size="21" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">零依赖的 Antigravity 三合一行为护栏插件。</text>
    <text x="0" y="198" fill="#6B7280" font-size="20" font-weight="400"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">分段写入、先回话汇报、工具摘要语言匹配，侧边栏实时调控。</text>

    <!-- Spec Metadata Row -->
    <g transform="translate(0 234)">
      <rect x="0" y="0" width="132" height="36" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="66" y="23.5" text-anchor="middle" fill="#374151" font-size="15.5" font-weight="600"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Node &gt;= 20</text>

      <rect x="144" y="0" width="126" height="36" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="207" y="23.5" text-anchor="middle" fill="#374151" font-size="15.5" font-weight="600"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">零第三方依赖</text>

      <rect x="282" y="0" width="166" height="36" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="365" y="23.5" text-anchor="middle" fill="#111827" font-size="15.5" font-weight="600"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Fail-Open 放行</text>

      <rect x="460" y="0" width="76" height="36" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="498" y="23.5" text-anchor="middle" fill="#6B7280" font-size="15.5" font-weight="600"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MIT</text>
    </g>
  </g>

  <!-- Right Native Proof: Clean Three-Rail Control Matrix -->
  <g id="rail-matrix-zh" transform="translate(698 34)">
    <rect x="0" y="0" width="446" height="292" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Matrix Header -->
    <circle cx="24" cy="27" r="5" fill="#10B981"/>
    <text x="38" y="32.5" fill="#111827" font-size="15.5" font-weight="700"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">3/3 模块生效</text>
    <text x="424" y="32.5" text-anchor="end" fill="#6B7280" font-size="14.5" font-weight="500"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AGENTS.md + Hooks</text>
    <line x1="18" y1="48" x2="428" y2="48" stroke="#E5E7EB" stroke-width="1.2"/>

    <!-- Rail 1: write-guard -->
    <g transform="translate(18 62)">
      <rect x="0" y="0" width="410" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
      <rect x="0" y="10" width="4" height="40" rx="2" fill="#2563EB"/>
      <text x="18" y="27" fill="#111827" font-size="18.5" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">分段写入</text>
      <text x="394" y="26" text-anchor="end" fill="#2563EB" font-size="15.5" font-weight="600"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">700 / 500 / 300 行</text>
      <text x="18" y="49" fill="#6B7280" font-size="15.5"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">PostToolUse 落盘检测，下轮事后提醒</text>
    </g>

    <!-- Rail 2: responsive-mode -->
    <g transform="translate(18 132)">
      <rect x="0" y="0" width="410" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
      <rect x="0" y="10" width="4" height="40" rx="2" fill="#64748B"/>
      <text x="18" y="27" fill="#111827" font-size="18.5" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">响应汇报</text>
      <text x="394" y="26" text-anchor="end" fill="#4B5563" font-size="15.5" font-weight="600"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4 / 6 / 10 次静默</text>
      <text x="18" y="49" fill="#6B7280" font-size="15.5"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">开场先回话、途中汇报与 file:/// 链接纠偏</text>
    </g>

    <!-- Rail 3: tool-locale -->
    <g transform="translate(18 202)">
      <rect x="0" y="0" width="410" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
      <rect x="0" y="10" width="4" height="40" rx="2" fill="#10B981"/>
      <text x="18" y="27" fill="#111827" font-size="18.5" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">摘要语言</text>
      <text x="394" y="26" text-anchor="end" fill="#059669" font-size="15.5" font-weight="600"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">9 种非拉丁脚本</text>
      <text x="18" y="49" fill="#6B7280" font-size="15.5"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">步骤、状态与命令摘要自动同轮纠偏</text>
    </g>

    <!-- Footer cue -->
    <path d="M22 272 L32 278 L22 284 Z" fill="#10B981"/>
    <text x="41" y="282.5" fill="#4B5563" font-size="14.5" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">不阻断写入落盘 · 双语侧边栏实时生效</text>
  </g>
</svg>
